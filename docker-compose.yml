version: "3.9"

services:
  openclaw-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: openclaw:local
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    ports:
      - "18789:18789"
      - "18790:18790"
    init: true
    restart: unless-stopped
    command:
      - node
      - dist/index.js
      - gateway
      - --allow-unconfigured
      - --bind
      - lan
      - --port
      - "18789"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`agents.digitalixhub.com`)"
      - "traefik.http.routers.openclaw.entrypoints=http,https"
      - "traefik.http.routers.openclaw.tls=true"
      - "traefik.http.routers.openclaw.priority=1000"
      - "traefik.http.services.openclaw.loadbalancer.server.port=18789"

volumes:
  openclaw_config:
  openclaw_workspace:
